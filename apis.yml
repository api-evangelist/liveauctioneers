aid: liveauctioneers
name: LiveAuctioneers
description: 'LiveAuctioneers is the world''s largest online marketplace for fine art, antiques,
  jewelry, collectibles, and luxury goods, connecting bidders with thousands of vetted auction
  houses worldwide. Founded in 2002 and headquartered in New York, it is part of Auction Technology
  Group (ATG). The platform offers live and timed online bidding, absentee and proxy bids, an
  auction-results and price-research database, seller consignment services, and an auctioneer
  partner portal. It is included in the API Evangelist network as a consumer-marketplace company
  profile surfaced from the Bessemer Venture Partners portfolio; it does not currently publish a
  public developer API.'
